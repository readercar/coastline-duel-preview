<!doctype html><meta charset="utf-8"><title>OutRun · Combat art QA (isolated fixture)</title>
<style>body{margin:16px;background:#ecf3ef;color:#423d55;font:15px system-ui}main{display:flex;gap:20px}iframe{width:390px;height:844px;border:0}aside{width:620px}button{margin:4px;padding:10px;border:1px solid #929ab2;background:#d4eceb;color:#423d55}pre{white-space:pre-wrap}h1{font-size:20px}</style>
<h1>OutRun combat art · isolated local fixture, no account or server writes</h1><main><iframe id="game" src="/"></iframe><aside>
<button onclick="fixture('ko')">Korean fixture</button><button onclick="fixture('en')">English fixture</button>
<button onclick="tab(0)">Guardian</button><button onclick="tab(1)">Companions</button><button onclick="tab(3)">Spirits</button><button onclick="tab(4)">Relics</button>
<button onclick="captureHit()">Tap hit + freeze</button><button onclick="shot()">Ally shots + freeze</button><button onclick="magic()">Magic + freeze</button><button onclick="defeat()">Defeat + freeze</button>
<button onclick="stress()">Check sprites / spam / cleanup / off</button><button onclick="downloadReport()">Download QA report</button>
<textarea id="shotdata" aria-label="Screenshot data" style="width:80px;height:20px"></textarea><button onclick="saveScreenshot()">Save browser screenshot</button><button onclick="shortScreen()">Short screen 320x640</button><pre id="state">Waiting for Cocos…</pre><pre id="report"></pre></aside></main>
<script>
const f=document.querySelector('iframe'),state=document.querySelector('#state'),out=document.querySelector('#report');let a,cc,reports=[],shotName='battle',locale='ko',errors=[];
f.addEventListener('load',()=>{f.contentWindow.addEventListener('error',e=>errors.push(e.message));});
async function get(){cc=await f.contentWindow.System.import('cc');a=cc.director.getScene()?.getChildByName('Canvas')?.getComponent('GameApp');if(!a?.entry)throw Error('Wait for Cocos GameApp');return a;}
function log(v){state.textContent=JSON.stringify(v,null,2);}
function check(ok,text){if(!ok)throw Error(text);return text;}
async function fixture(lang){await get();cc.director.resume();a.close();locale=lang;const G=a.game.constructor;a.game=new G();a.game.persist=()=>{};a.game.s.locale=lang;a.game.s.audio=false;a.game.s.tutorial.step=7;a.game.s.maxStage=90;a.game.s.run.stage=63;a.game.s.run.master=15;a.game.s.run.gold=3;a.game.s.run.hp=a.game.maxHP();a.game.s.run.heroes[0]=1;a.game.s.run.heroes[1]=1;a.game.s.run.heroes[2]=1;a.game.s.pets.fill(3);a.game.s.artifacts.fill(1);a.game.s.extra.unlockNotices=[];a.game.s.extra.rewardNotices=[];a.entry.screen='game';a.operations.ready=true;a.operations.busy=false;a.operations.conflict=false;a.liveOps.blocked=false;a.liveOps.tick=()=>{};a.operations.report=(_code,e)=>errors.push(String(e));a.saveClock=-1e9;a.seenKills=a.game.s.totalKills;a.enemyTransition=0;a.tab=0;a.draw();setTimeout(()=>{cc.director.pause();log({locale,missing:a.ui.missing,loadedEffects:[...a.ui.frames.keys()].filter(k=>k.startsWith('effects/')),accountWrites:false});},150);}
async function tab(i){cc.director.resume();a.close();a.tab=i;a.drawPanel();shotName=['guardian','companions','gear','spirits','relics'][i];setTimeout(()=>cc.director.pause(),120);log({locale,tab:i});}
function resume(){cc.director.resume();a.close();a.enemyTransition=0;a.game.s.extra.effects=true;a.particles.active=true;}
function freeze(name){shotName=name;setTimeout(()=>{cc.director.pause();log({scenario:name,locale,effects:a.particles.children.filter(n=>n.getComponent(cc.Sprite)).map(n=>n.name),errors});},75);}
function captureHit(){resume();a.attack();freeze('tap-hit');}
function shot(){resume();[0,1,2].forEach(id=>a.animateAlly(id,.5));freeze('ally-shots');}
function magic(){resume();a.spark(0,130,'#8670a8');freeze('magic');}
function defeat(){resume();a.game.s.run.hp=1;a.attack();freeze('defeat');}
async function stress(){try{resume();a.game.s.run.hp=a.game.maxHP();a.game.s.run.heroes.fill(0);a.syncAllies();const h=a.game.s.run.hp;a.attack();check(a.game.s.run.hp<h,'Tap deals damage');for(let i=0;i<80;i++)a.spark(0,130,'#815579');const sprites=a.particles.children.filter(n=>n.getComponent(cc.Sprite));check(sprites.length<=72,'Sprite cap');check(sprites.every(n=>!!n.getComponent(cc.Sprite).spriteFrame&&!n.getComponent(cc.Graphics)),'Every combat FX uses a SpriteFrame, no Graphics');check(a.ui.missing.length===0,'No missing art');const results={spriteCap:sprites.length,allSprites:true,damage:true};setTimeout(()=>{try{const remaining=a.particles.children.length;check(remaining===0,'Effects and damage labels cleaned up');a.game.s.extra.effects=false;a.particles.active=false;a.spark(0,130,'#8670a8');a.animateAlly(0);a.attack();check(a.particles.children.length===0,'Effects-off spawns no sprites');a.game.s.extra.effects=true;cc.director.pause();reports.push({locale,...results,cleanup:remaining,effectsOff:true,errors:[...errors]});out.textContent=JSON.stringify(reports,null,2);}catch(e){log({FAIL:e.message});}},1200);}catch(e){log({FAIL:e.message});}}
function save(blob,name){const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),2000);}
function saveScreenshot(){const v=document.querySelector('#shotdata').value;fetch(v).then(r=>r.blob()).then(b=>save(b,`outrun-browser-${shotName}-${locale}.jpg`));}
function shortScreen(){f.style.width='320px';f.style.height='640px';cc.director.resume();shotName='short-'+shotName;setTimeout(()=>{cc.director.pause();log({locale,viewport:[320,640],scenario:shotName});},200);}
function downloadReport(){save(new Blob([JSON.stringify({reports,errors},null,2)],{type:'application/json'}),'outrun-combat-art-qa.json');}
setInterval(async()=>{if(!a)try{await get();log({ready:true,entry:a.entry.screen,missing:a.ui.missing});}catch{}},1000);
</script>
