<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OutRun Operations</title><style>body{font:16px system-ui;background:#e9f4ee;color:#413d53;max-width:1000px;margin:30px auto;padding:20px}button,input,textarea,select{font:inherit;border:1px solid #8c91ad;border-radius:0;padding:10px;background:#faf7ff;color:inherit}button{background:#cce5de;cursor:pointer}textarea{width:95%;min-height:110px}section{padding:20px;margin:20px 0;background:#f9f8fc}.row{display:flex;gap:8px;flex-wrap:wrap}h2{font-size:21px}label{display:block;margin:10px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}.notice{padding:14px 0;border-bottom:1px solid #cbd4e3}.notice input{width:45%}small{display:block}.status{padding:10px;background:#ffdbcc}</style>
<div class="row"><h1 data-i="title"></h1><select id="lang"><option value="ko">한국어</option><option value="en">English</option></select><button id="refresh" data-i="refresh"></button></div><p class="status" id="status"></p>
<section><h2 data-i="notices"></h2><p data-i="noticeInfo"></p><div id="notices"></div><button id="add" data-i="add"></button><button id="save" data-i="save"></button></section>
<section><h2 data-i="versions"></h2><div id="versions"></div><button id="versionSave" data-i="save"></button></section>
<section><h2 data-i="mail"></h2><p data-i="mailInfo"></p><div class="row"><input id="mailId" placeholder="ID"><input id="recipient" value="all" placeholder="all / UID"></div><label><span data-i="subject"></span><input id="mailTitle" maxlength="60"></label><textarea id="mailBody" maxlength="3000"></textarea><details><summary>한국어 / English</summary><input id="mailTitleKo" placeholder="한국어 제목"><textarea id="mailBodyKo" placeholder="한국어 본문"></textarea><input id="mailTitleEn" placeholder="English title"><textarea id="mailBodyEn" placeholder="English body"></textarea></details><div class="row"><label><span data-i="gems"></span> <input id="gems" type="number" min="0" value="0"></label><label><span data-i="shards"></span> <input id="shards" type="number" min="0" value="0"></label><label><span data-i="dust"></span> <input id="dust" type="number" min="0" value="0"></label><label><span data-i="petId"></span> <input id="pet" type="number" min="0" max="11" value="0"></label><label><span data-i="petLevels"></span> <input id="petLevels" type="number" min="0" value="0"></label></div><button id="mailSend" data-i="sendMail"></button><div id="mails"></div></section>
<section><h2 data-i="push"></h2><p data-i="pushInfo"></p><div class="row"><select id="pushNotice"></select><select id="pushLocale"><option value="ko">한국어</option><option value="en">English</option></select></div><input id="pushTitle" maxlength="60" placeholder="Title"><textarea id="pushBody" maxlength="500"></textarea><button id="pushSend" data-i="sendPush"></button></section>
<section><h2 data-i="errors"></h2><pre id="errors"></pre></section>
<script>
const token='__TOKEN__';let state,locale='ko',mailCreated={};const $=id=>document.getElementById(id);
const copy={ko:{title:'OutRun 운영 도구',refresh:'새로고침',notices:'공지',noticeInfo:'최대 30개. 같은 ID의 수정은 이미 읽은 계정에 다시 표시되지 않습니다. 공지와 보상 우편은 별개입니다.',add:'공지 추가',save:'저장 후 다시 확인',versions:'버전 제한',mail:'서버 우편',mailInfo:'수령 시 보상과 서버 저장을 함께 갱신합니다. 유효기간은 발송 후 30일입니다. 동일 ID 재발송은 내용이 같아야 합니다.',subject:'제목',sendMail:'우편 발송',push:'Android 공지 알림',pushInfo:'공지를 먼저 저장하세요. 동의한 언어별 토픽에 발송합니다. 로컬 모드에서는 발송할 수 없습니다.',sendPush:'선택 공지 알림 발송',errors:'오류 수신',revoke:'미수령 우편 회수',remove:'삭제',up:'위로',down:'아래로',confirmPush:'실제 Android 알림을 발송할까요?',confirmMail:'이 대상으로 우편을 발송할까요?',target:'연결 대상',ok:'저장 및 다시 확인 완료',gems:'보석',shards:'기억 조각',dust:'분진',petId:'정령 ID',petLevels:'정령 레벨',versionFields:'최소 / 필수 일치 / HTTPS 주소',revoked:'회수됨',noticeId:'공지 ID',body:'본문'},en:{title:'OutRun Operations',refresh:'Refresh',notices:'Notices',noticeInfo:'Up to 30 notices. Editing a read ID does not display it again. Notices never grant mail rewards.',add:'Add notice',save:'Save and read back',versions:'Version policy',mail:'Server mail',mailInfo:'Claim updates rewards and the save atomically. Mail expires in 30 days. Retry an ID with identical content.',subject:'Title',sendMail:'Send mail',push:'Android notice push',pushInfo:'Save the notice first. Send to opted-in language topics. Push is disabled in local mode.',sendPush:'Broadcast selected notice',errors:'Error reports',revoke:'Revoke unclaimed mail',remove:'Delete',up:'Move up',down:'Move down',confirmPush:'Send a real Android notification?',confirmMail:'Send mail to this recipient?',target:'Target',ok:'Saved and verified',gems:'Gems',shards:'Memory shards',dust:'Dust',petId:'Spirit ID',petLevels:'Spirit levels',versionFields:'Minimum / exact required / HTTPS URL',revoked:'Revoked',noticeId:'Notice ID',body:'Body'}};
function tr(k){return copy[locale][k]}function language(){document.documentElement.lang=locale;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));if(state)render();}
async function request(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json','X-Admin-Token':token},...(data?{body:JSON.stringify(data)}:{})});const v=await r.json();if(!r.ok)throw Error(v.error);return v;}
function el(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;}
function field(parent,value,change,multiline=false){const e=el(multiline?'textarea':'input');e.value=value||'';e.maxLength=multiline?3000:60;e.oninput=()=>change(e.value);parent.append(e);return e;}
function render(){const p=state.policy;$('status').textContent=tr('target')+': '+state.project+' / '+state.target;$('notices').replaceChildren();p.notices.forEach((n,i)=>{const row=el('div');row.className='notice';field(row,n.id,v=>n.id=v).setAttribute('aria-label',tr('noticeId')+' '+(i+1));field(row,n.title,v=>n.title=v).setAttribute('aria-label',tr('subject')+' '+(i+1));field(row,n.body,v=>n.body=v,true).setAttribute('aria-label',tr('body')+' '+(i+1));['ko','en'].forEach(l=>{const details=el('details'),sum=el('summary',l);details.append(sum);n.localizations=n.localizations||{};const m=n.localizations[l]||{title:'',body:''};field(details,m.title,v=>{m.title=v;if(v)n.localizations[l]=m;else delete n.localizations[l];});field(details,m.body,v=>{m.body=v;if(m.title)n.localizations[l]=m;},true);row.append(details);});[['up',-1],['down',1],['remove',0]].forEach(([k,d])=>{const b=el('button',tr(k));b.onclick=()=>{if(!d)p.notices.splice(i,1);else if(p.notices[i+d]){[p.notices[i],p.notices[i+d]]=[p.notices[i+d],p.notices[i]];}render();};row.append(b);});$('notices').append(row);});$('versions').replaceChildren();['web','android','ios'].forEach(k=>{const r=el('div',k+' · '+tr('versionFields'));field(r,p.minimumVersion[k],v=>p.minimumVersion[k]=v);field(r,p.requiredVersion?.[k]||'0',v=>{p.requiredVersion=p.requiredVersion||{};p.requiredVersion[k]=v;});field(r,p.storeUrls[k],v=>p.storeUrls[k]=v).maxLength=2000;$('versions').append(r);});$('pushNotice').replaceChildren();p.notices.forEach(n=>{const o=el('option',n.id+' · '+n.title);o.value=n.id;$('pushNotice').append(o);});$('pushSend').disabled=state.target!=='firebase';$('mails').replaceChildren();state.mails.forEach(m=>{const r=el('p',m.id+' · '+m.title+' · '+m.recipient+' · '+(m.revoked?tr('revoked'):new Date(m.expires).toLocaleString(locale))),b=el('button',tr('revoke'));b.disabled=m.revoked;b.onclick=()=>run(async()=>{await request('/revoke',{id:m.id});await refresh();});r.append(b);$('mails').append(r);});$('errors').textContent=JSON.stringify(state.errors,null,2);}
async function refresh(){state=await request('/state');render();}function run(work){work().catch(e=>$('status').textContent=e.message);}
$('lang').onchange=()=>{locale=$('lang').value;language();};$('refresh').onclick=()=>run(refresh);$('add').onclick=()=>{if(state.policy.notices.length<30)state.policy.notices.push({id:'notice-'+Date.now(),title:'',body:''});render();};$('save').onclick=$('versionSave').onclick=()=>run(async()=>{await request('/policy',state.policy);await refresh();$('status').textContent=tr('ok');});
$('mailSend').onclick=()=>run(async()=>{if(!confirm(tr('confirmMail')))return;const id=$('mailId').value,created=state.mails.find(m=>m.id===id)?.created||mailCreated[id]||Date.now();mailCreated[id]=created;await request('/mail',{id:$('mailId').value,title:$('mailTitle').value,body:$('mailBody').value,localizations:Object.fromEntries(['ko','en'].filter(l=>$(l==='ko'?'mailTitleKo':'mailTitleEn').value).map(l=>[l,{title:$(l==='ko'?'mailTitleKo':'mailTitleEn').value,body:$(l==='ko'?'mailBodyKo':'mailBodyEn').value}])),recipient:$('recipient').value,created,expires:created+30*86400000,revoked:false,rewards:Object.fromEntries(['gems','shards','dust','pet','petLevels'].map(k=>[k,Number($(k).value)]))});await refresh();});
$('pushSend').onclick=()=>run(async()=>{if(!confirm(tr('confirmPush')))return;await request('/push',{noticeId:$('pushNotice').value,locale:$('pushLocale').value,title:$('pushTitle').value,body:$('pushBody').value});await refresh();});language();run(refresh);
</script></html>
