<!doctype html><html lang="en"><meta charset="utf-8"><title>tapWar responsive QA</title><style>body{margin:0;background:#202527;color:#e1e8ed;font:14px sans-serif}header{height:56px;display:flex;justify-content:center;align-items:center;gap:12px}button{padding:8px 14px}main{display:flex;justify-content:center;height:750px}iframe{border:0;transform-origin:top center}</style><header><span>Prototype viewport QA</span><button data-w="360" data-h="640">360 × 640</button><button data-w="320" data-h="640">320 × 640</button><button data-w="390" data-h="844">390 × 844</button></header><main><iframe title="tapWar prototype" width="360" height="640" src="http://localhost:8850/"></iframe></main><script>const f=document.querySelector('iframe');document.querySelectorAll('button').forEach(b=>b.onclick=()=>{f.width=b.dataset.w;f.height=b.dataset.h;f.style.transform=Number(f.height)>700?'scale(.8)':'none';});</script></html>
