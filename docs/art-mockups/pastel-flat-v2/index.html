<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>잿불의 탑 · 파스텔 UI 목업</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="pastel-ui" class="pu-review">
    <header class="pu-review-head">
      <div><span class="pu-eyebrow" data-copy="review.eyebrow"></span><h1 data-copy="review.title"></h1></div>
      <div class="pu-review-options"><button type="button" data-review="gallery" data-copy="review.all"></button><button type="button" data-review="single" data-copy="review.play"></button><button type="button" data-locale="ko" data-copy="settings.ko"></button><button type="button" data-locale="en" data-copy="settings.en"></button></div>
    </header>
    <main class="pu-gallery"></main>
  </div>
  <script src="copy.js"></script>
  <script src="mockup.js"></script>
</body>
</html>
