#pastel-ui{--pu-ink:#46445f;--pu-muted:#656879;--pu-paper:#fafaf5;--pu-mint:#deeee7;--pu-green:#bddcd0;--pu-lilac:#e4dcf0;--pu-peach:#f8d5bc;--pu-pink:#efd5df;--pu-blue:#d6e9ef;--pu-accent:#d6c6e8;font-family:&#x27;Apple SD Gothic Neo&#x27;,&#x27;Noto Sans KR&#x27;,Arial,sans-serif;color:var(--pu-ink);font-size:16px;line-height:1.35}
#pastel-ui *{box-sizing:border-box}
#pastel-ui button{font:inherit;border:0;border-radius:0;box-shadow:none;color:inherit;background:transparent;cursor:default}
#pastel-ui button:focus-visible{outline:3px solid #6d5f9a;outline-offset:-3px}
#pastel-ui img{display:block;max-width:100%;image-rendering:pixelated}
#pastel-ui .pu-review-head{max-width:1160px;margin:30px auto 28px;padding:0 12px;display:flex;gap:20px;align-items:flex-end;justify-content:space-between}
#pastel-ui .pu-eyebrow{font-size:12px;letter-spacing:2px;color:var(--pu-muted)}
#pastel-ui h1{font-family:PastelRix,sans-serif;font-size:30px;font-weight:400;line-height:1.2;margin:8px 0 0}
#pastel-ui .pu-review-options{display:flex;gap:10px;flex-wrap:wrap}
#pastel-ui .pu-review-options button{padding:9px 12px;background:var(--pu-mint);font-size:13px}
#pastel-ui .pu-gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 24px;max-width:1140px;margin:0 auto 30px}
#pastel-ui .pu-study{min-width:0}
#pastel-ui .pu-caption{font-family:PastelRix,sans-serif;font-size:21px;margin:0 0 10px;font-weight:400}
#pastel-ui .pu-screen{width:100%;aspect-ratio:1/2;position:relative;container-type:inline-size;overflow:hidden;background:var(--pu-paper);font-size:16px}
#pastel-ui .pu-title{font-family:PastelRix,sans-serif;font-size:max(13px,4.2cqw);font-weight:400;line-height:1.2}
#pastel-ui .pu-resourcebar{position:absolute;inset:0 0 auto;height:4.6%;display:flex;align-items:center;gap:4cqw;padding:0 3.8cqw;background:var(--pu-mint);font-family:PastelRix,sans-serif;font-size:max(13px,3.9cqw)}
#pastel-ui .pu-brand{margin-right:auto;font-size:max(12px,3.4cqw)}
#pastel-ui .pu-currency{display:flex;align-items:center;gap:1.3cqw}
#pastel-ui .pu-currency img{width:5cqw;height:5cqw;object-fit:contain}
#pastel-ui .pu-symbol{color:#886c32;font-family:Arial,sans-serif;font-size:5cqw}
#pastel-ui .pu-arena{position:absolute;inset:4.6% 0 auto;height:45.6%;background:#bdeaf2;overflow:hidden}
#pastel-ui .pu-battle-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center}
#pastel-ui .pu-arena-hit{position:absolute;inset:25% 16% 0;width:68%;height:75%}
#pastel-ui .pu-stage-head{position:absolute;top:1.6cqw;left:2.3cqw;right:2.3cqw;display:flex;align-items:center;gap:2cqw}
#pastel-ui .pu-settings{width:10cqw;height:10cqw;display:grid;place-items:center;padding:1.5cqw}
#pastel-ui .pu-settings img{width:7cqw;height:7cqw;object-fit:contain}
#pastel-ui .pu-stage{margin:auto;text-align:center;font-family:PastelRix,sans-serif;font-size:max(18px,5.8cqw);line-height:1.1}
#pastel-ui .pu-stage small{display:block;font-family:&#x27;Apple SD Gothic Neo&#x27;,Arial,sans-serif;font-size:max(11px,3.2cqw);margin-top:.8cqw;color:#4b6875}
#pastel-ui .pu-boss{background:var(--pu-peach);height:9.2cqw;padding:0 2.5cqw;font-family:PastelRix,sans-serif;font-size:max(12px,3.6cqw)}
#pastel-ui .pu-enemy{position:absolute;top:14.7cqw;left:21cqw;right:21cqw;font-size:max(11px,3.15cqw)}
#pastel-ui .pu-health-label{display:flex;justify-content:space-between;gap:1cqw;font-weight:600;margin-bottom:.7cqw}
#pastel-ui .pu-health-track{height:2.7cqw;background:#d5d4e5}
#pastel-ui .pu-health-fill{height:100%;width:77%;background:#b998c9}
#pastel-ui .pu-progress{text-align:left;margin-top:1cqw;color:#4a6371;font-size:max(11px,2.9cqw)}
